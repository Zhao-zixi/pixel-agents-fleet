# Automatic CI is intentionally a single Linux job. Full platform validation
# and report uploads live in ci-full.yml and require an explicit manual run.
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', LICENSE, .github/FUNDING.yml]
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE, .github/FUNDING.yml]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Dependencies
        run: npm ci
      - name: Validate CI policy
        run: node scripts/check-ci-policy.mjs
      - name: Validate protocol and generated files
        run: |
          npm run asyncapi:validate
          npm run asyncapi:generate
          npm run e2e:inventory
          git diff --exit-code core/src/messages.ts e2e/README.md
      - name: Type Check
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Build
        run: |
          npm run build:extension
          npm run build:webview
      - name: Unit Tests
        run: npm test
