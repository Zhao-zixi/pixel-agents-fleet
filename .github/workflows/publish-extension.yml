# This fork publishes GitHub assets only. No npm or extension-marketplace credentials are used.
name: Package Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and smoke-test Windows x64 portable package
        shell: powershell
        run: ./scripts/package-windows.ps1
      - name: Verify archive after extraction
        shell: powershell
        run: |
          $archive = Get-ChildItem release/*.zip | Select-Object -First 1
          Expand-Archive $archive.FullName "$env:RUNNER_TEMP/fleet-unpacked"
          $bundle = Get-ChildItem "$env:RUNNER_TEMP/fleet-unpacked" -Directory | Select-Object -First 1
          node scripts/verify-windows-package.mjs $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Extracted archive verification failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: release/*
          if-no-files-found: error
          retention-days: 3
